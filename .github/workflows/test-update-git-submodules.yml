name: 🧪 Test update-git-submodules
on:
  pull_request:
    branches: [main]
    paths: ["update-git-submodules/**.ts"]
  workflow_run:
    workflows: ["release"]
    types: ["completed"]
  workflow_dispatch:
env:
  HUSKY: 0
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          cache: "pnpm"
          node-version-file: ".node-version"
      - name: 📦 Installing dependencies
        run: pnpm install
      - name: 🏗️ Build all actions
        run: pnpm run build
      - name: 🧱 Build fixture parent + child submodule repos
        id: fixture
        run: |
          set -euo pipefail
          git config --global protocol.file.allow always
          FIXTURE_ROOT="$RUNNER_TEMP/ugs-fixture"
          CHILD="$FIXTURE_ROOT/child"
          PARENT="$FIXTURE_ROOT/parent"
          mkdir -p "$CHILD" "$PARENT"

          git -C "$CHILD" init -q -b main
          git -C "$CHILD" config user.email test@example.com
          git -C "$CHILD" config user.name test
          echo "v1" > "$CHILD/README.md"
          git -C "$CHILD" add README.md
          git -C "$CHILD" commit -q -m "v1"
          BASELINE_SHA="$(git -C "$CHILD" rev-parse HEAD)"

          git -C "$PARENT" init -q -b main
          git -C "$PARENT" config user.email test@example.com
          git -C "$PARENT" config user.name test
          git -C "$PARENT" submodule add --name child -b main "$CHILD" vendor/child
          git -C "$PARENT" commit -q -m "add submodule"

          echo "v2" > "$CHILD/README.md"
          git -C "$CHILD" commit -q -am "v2"
          ADVANCED_SHA="$(git -C "$CHILD" rev-parse HEAD)"

          echo "parent=$PARENT" >> "$GITHUB_OUTPUT"
          echo "baseline=$BASELINE_SHA" >> "$GITHUB_OUTPUT"
          echo "advanced=$ADVANCED_SHA" >> "$GITHUB_OUTPUT"
      - name: 🚀 Run update-git-submodules against the fixture
        id: update
        working-directory: ${{ steps.fixture.outputs.parent }}
        env:
          INPUT_GITMODULESPATH: .gitmodules
          INPUT_STRATEGY: commit
          INPUT_SUBMODULES: ""
          # No token needed — the fixture uses local file:// repositories.
          INPUT_TOKEN: ""
        run: node ${{ github.workspace }}/update-git-submodules/dist/index.mjs
      - name: ✅ Verify outputs
        env:
          PARENT: ${{ steps.fixture.outputs.parent }}
          BASELINE: ${{ steps.fixture.outputs.baseline }}
          ADVANCED: ${{ steps.fixture.outputs.advanced }}
          REMOTE_NAME: ${{ steps.update.outputs['child--remoteName'] }}
          URL_OUTPUT: ${{ steps.update.outputs['child--url'] }}
          PREV_OUTPUT: ${{ steps.update.outputs['child--previousCommitSha'] }}
          LATEST_OUTPUT: ${{ steps.update.outputs['child--latestCommitSha'] }}
          PATH_PREV_OUTPUT: ${{ steps.update.outputs['vendor/child--previousCommitSha'] }}
          PATH_LATEST_OUTPUT: ${{ steps.update.outputs['vendor/child--latestCommitSha'] }}
          JSON_OUTPUT: ${{ steps.update.outputs.json }}
        run: |
          set -euo pipefail
          echo "BASELINE=$BASELINE"
          echo "ADVANCED=$ADVANCED"
          echo "PREV_OUTPUT=$PREV_OUTPUT"
          echo "LATEST_OUTPUT=$LATEST_OUTPUT"
          echo "PATH_PREV_OUTPUT=$PATH_PREV_OUTPUT"
          echo "PATH_LATEST_OUTPUT=$PATH_LATEST_OUTPUT"
          echo "URL_OUTPUT=$URL_OUTPUT"
          echo "REMOTE_NAME=$REMOTE_NAME"
          echo "--- submodule status ---"
          git -C "$PARENT" submodule status
          echo "--- json ---"
          echo "$JSON_OUTPUT"
          echo "--- asserting ---"
          test -n "$JSON_OUTPUT"
          test "$PREV_OUTPUT" = "$BASELINE"
          test "$LATEST_OUTPUT" = "$ADVANCED"
          # path-prefix outputs must mirror name-prefix outputs
          test "$PATH_PREV_OUTPUT" = "$BASELINE"
          test "$PATH_LATEST_OUTPUT" = "$ADVANCED"
          test -n "$URL_OUTPUT"
          # url and remoteName must be distinct outputs (regression for original bug)
          test "$URL_OUTPUT" != "$REMOTE_NAME"
      - name: "🧨 Wipe submodule working tree so init: true must reclone it"
        env:
          PARENT: ${{ steps.fixture.outputs.parent }}
        run: |
          set -euo pipefail
          git -C "$PARENT" submodule deinit -f vendor/child
          rm -rf "$PARENT/vendor/child" "$PARENT/.git/modules/child"
          # Sanity: the working tree is empty before the action runs.
          test ! -e "$PARENT/vendor/child/README.md"
      - name: 🛑 Action must fail fast when a submodule is uninitialized and init is off
        working-directory: ${{ steps.fixture.outputs.parent }}
        env:
          INPUT_GITMODULESPATH: .gitmodules
          INPUT_STRATEGY: commit
          INPUT_SUBMODULES: ""
          INPUT_TOKEN: ""
        run: |
          set -euo pipefail
          set +e
          output="$(node ${{ github.workspace }}/update-git-submodules/dist/index.mjs 2>&1)"
          status=$?
          set -e
          echo "--- action output ---"
          echo "$output"
          echo "--- asserting ---"
          test "$status" -ne 0
          echo "$output" | grep -F "Submodule path(s) not initialized: vendor/child"
          echo "$output" | grep -F "init: true"
      - name: "🚀 Run update-git-submodules with init: true"
        id: update-init
        working-directory: ${{ steps.fixture.outputs.parent }}
        env:
          INPUT_GITMODULESPATH: .gitmodules
          INPUT_INIT: "true"
          INPUT_STRATEGY: commit
          INPUT_SUBMODULES: ""
          INPUT_TOKEN: ""
        run: node ${{ github.workspace }}/update-git-submodules/dist/index.mjs
      - name: "✅ Verify init: true re-cloned the submodule and produced outputs"
        env:
          PARENT: ${{ steps.fixture.outputs.parent }}
          ADVANCED: ${{ steps.fixture.outputs.advanced }}
          LATEST_OUTPUT: ${{ steps.update-init.outputs['child--latestCommitSha'] }}
          JSON_OUTPUT: ${{ steps.update-init.outputs.json }}
        run: |
          set -euo pipefail
          echo "--- submodule status after init ---"
          git -C "$PARENT" submodule status
          echo "--- asserting working tree is back ---"
          test -f "$PARENT/vendor/child/README.md"
          echo "--- asserting outputs ---"
          test -n "$JSON_OUTPUT"
          test "$LATEST_OUTPUT" = "$ADVANCED"

name: update-git-submodules example
on:
  workflow_dispatch:
jobs:
  example:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: stephansama/actions/update-git-submodules@v1
        id: update
      - run: echo "${{ steps.update.outputs.prBody }}"

  example-init:
    # Cross-repo private submodules: skip `submodules: recursive` on checkout
    # and let the action clone + update them itself with one PAT.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: stephansama/actions/update-git-submodules@v1
        id: update
        with:
          init: true
          token: ${{ secrets.SUBMODULE_PAT }}
      - run: echo "${{ steps.update.outputs.prBody }}"
